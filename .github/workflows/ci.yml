# H-040: every gate on push and pull request. bin/agent-spec-check-all.sh is the single
# source of truth for what "green" means; this file only provides the machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest
      - name: Python gates
        env:
          SKIP_UI: "1"
          AGENT_SPEC_CURSOR_STORE: "0"
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          bash bin/agent-spec-check-all.sh

  ui:
    name: Dashboard UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-src/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui-src
      - run: npx tsc --noEmit -p .
        working-directory: ui-src
      - run: npx vitest run
        working-directory: ui-src
      - name: Build and gzip budget
        run: npm run -s build
        working-directory: ui-src

  install:
    name: Install matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean install, register, check, uninstall
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME/.cursor"
          proj="$RUNNER_TEMP/proj"; mkdir -p "$proj"; printf 'def f():\n    return 1\n' > "$proj/app.py"
          git -C "$proj" init -q
          ./install.sh --skills-only
          ./install.sh --register "$proj"
          ./check-install.sh
          ( cd "$proj" && python3 ./.agent-spec/bin/agent-spec-doctor.py --project "$proj" )
          ./uninstall.sh --unregister "$proj"
          ./uninstall.sh

  install-windows:
    # H-042: the same install cycle under Git Bash on Windows. A manual run on a real
    # developer machine is still owed; this job catches path and shell regressions first.
    name: Install matrix (windows-latest, Git Bash)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python3 shim (Windows ships python.exe only)
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3"
          chmod +x "$RUNNER_TEMP/shim/python3"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: Clean install, register, check, uninstall
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME/.cursor"
          proj="$RUNNER_TEMP/proj"; mkdir -p "$proj"; printf 'def f():\n    return 1\n' > "$proj/app.py"
          git -C "$proj" init -q
          ./install.sh --skills-only
          ./install.sh --register "$proj"
          ./check-install.sh
          ( cd "$proj" && python3 ./.agent-spec/bin/agent-spec-doctor.py --project "$proj" )
          ./uninstall.sh --unregister "$proj"
          ./uninstall.sh
